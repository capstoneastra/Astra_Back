# PR 과 main 푸시마다 빌드 + 테스트 (Testcontainers 로 PostgreSQL 16 에서 검증)
# 빨간색(실패)이면 main 에 병합하지 않습니다.
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Java 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        run: ./gradlew build --console=plain

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
