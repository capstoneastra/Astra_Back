spring:
  application:
    name: astra
  config:
    # 프로젝트 루트의 .env (KEY=VALUE) 를 읽습니다. .env 는 커밋 금지, .env.example 참고
    import: optional:file:.env[.properties]

  # 로컬: compose.yaml 의 DB 를 자동 실행. 앱을 꺼도 DB 는 계속 켜 둠
  docker:
    compose:
      lifecycle-management: start-only

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/astra}
    username: ${DB_USERNAME:astra}
    password: ${DB_PASSWORD:astra}
    hikari:
      # 기본 10 은 동시 요청이 몰리면 금방 바닥남. 연결을 못 받으면 30초 대신 10초 안에 실패
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 10000

  servlet:
    multipart:
      # 첨부파일·성적서 파일 크기 상한
      max-file-size: 20MB
      max-request-size: 21MB

  data:
    web:
      pageable:
        # 목록 API 의 size 상한 (기본 2000). 더 크게 보내면 100 으로 잘림
        max-page-size: 100

  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway 가 만들고, JPA 는 Entity 가 테이블과 맞는지만 검사
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

  # 회원가입 인증 메일. MAIL_HOST 가 비어 있으면 실제로 보내지 않고 서버 로그에 출력 (MailConfig)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # 메일 서버가 응답하지 않을 때 요청 스레드가 무한정 기다리지 않게 (기본값은 무제한)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  health:
    # SMTP 연결은 헬스체크에서 빼기 (MAIL_HOST 가 없는 로컬·시연 서버에서 DOWN 으로 잡히지 않게)
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

astra:
  rules:
    # 회의 결정으로 추가된 필수 검사(연구자번호, 제출 필수 칸, 결과 등록 후 완료). 프론트가 새 칸을 만들기 전 연동할 때만 false
    strict: ${ASTRA_RULES_STRICT:true}
  security:
    # true: /auth/** (로그아웃 제외), Swagger, 헬스체크 외에는 전부 로그인 필요 (api-spec.md §0-4)
    # 로컬에서 잠깐 로그인 없이 호출해 보려면 false 로 실행 (커밋 금지)
    require-login: true
  cors:
    # 브라우저에서 API 를 부를 수 있는 프론트 주소 (쉼표로 여러 개, http://localhost:* 같은 패턴 가능). 기본: Vite 개발 서버
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-validity-seconds: 3600
    refresh-token-validity-seconds: 1209600   # 14일
  mail:
    # 보내는 사람 주소. 실제 발송은 MAIL_HOST 등 SMTP 설정이 있을 때만 (.env.example 참고)
    from: ${MAIL_FROM:no-reply@astra.local}
    # true 면 메일을 보낸 뒤 서버 로그에도 인증 코드를 남김 (일회용 메일이 늦을 때 대비, 시연 날에만 켜기)
    log-code: ${MAIL_LOG_CODE:false}
  demo:
    reservations:
      # 서버 시작·매일 0시 10분에 manager1 조직 장비에 "오늘부터 14일 안" 시연 예약 4건을 맞춤 (시연 계정이 없으면 아무것도 안 함)
      enabled: ${ASTRA_DEMO_RESERVATIONS:true}
  equipment:
    update-reminder:
      enabled: true   # 매일 오전 9시 마지막 갱신 90일 지난 장비 알림 (BE-B 알림 구현이 있을 때만 발송)
  email-verification:
    code-validity-seconds: 600     # 인증 코드 10분
    token-validity-seconds: 1800   # 인증 후 가입까지 30분
    resend-interval-seconds: 60    # 같은 이메일로 다시 보내려면 60초 뒤
    max-attempts: 5                # 코드를 5번 틀리면 다시 받아야 함
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
    # 임시 Gemini 테스트. Claude 복귀: .env에서 AI_PROVIDER=anthropic (위 Claude 설정은 보존).
    provider: ${AI_PROVIDER:gemini}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
    # 503(과부하)·429(한도)·시간 초과면 다음 모델로 넘김 (쉼표 순서). 비우면 gemini-model 하나만.
    # Gemini 가 모두 막히면 ANTHROPIC_API_KEY 가 있을 때 위 model(Claude)로 한 번 더 시도.
    gemini-models: ${GEMINI_MODELS:}
    # 모델 하나당 기다리는 최대 시간(초)
    model-timeout-seconds: ${AI_MODEL_TIMEOUT_SECONDS:12}
    # 상담 메시지 하나의 AI 전체 마감(초)과 그중 조건 추출 몫. 넘으면 AI_UPSTREAM_ERROR(502)
    chat-timeout-seconds: ${AI_CHAT_TIMEOUT_SECONDS:25}
    chat-extraction-seconds: ${AI_CHAT_EXTRACTION_SECONDS:10}
