spring:
  application:
    name: astra
  config:
    # 프로젝트 루트의 .env (KEY=VALUE) 를 읽습니다. .env 는 커밋 금지, .env.example 참고
    import: optional:file:.env[.properties]

  # 로컬: compose.yaml 의 DB 를 자동 실행. 앱을 꺼도 DB 는 계속 켜 둠
  docker:
    compose:
      lifecycle-management: start-only

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/astra}
    username: ${DB_USERNAME:astra}
    password: ${DB_PASSWORD:astra}

  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway 가 만들고, JPA 는 Entity 가 테이블과 맞는지만 검사
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

astra:
  security:
    # false: 로그인 없이 모든 API 호출 가능 (JWT 필터 붙이기 전 개발용)
    # JWT 인증 필터(BE-A 2주차)를 붙이는 PR 에서 true 로 변경 → /auth/** 외 전부 로그인 필요 (api-spec.md §0-4)
    require-login: false
  jwt:
    secret: ${JWT_SECRET:}
    access-token-validity-seconds: 3600
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
