# 통합 테스트는 모든 요청이 같은 IP(127.0.0.1)에서 오므로 인증 API 횟수 제한을 사실상 끔.
# 제한 동작 자체는 AuthRateLimiterTest·TokenBucketRateLimiterTest 에서 검증
astra.rate-limit.email-verification-per-ip-per-minute=100000
astra.rate-limit.email-verification-global-per-minute=100000
astra.rate-limit.login-per-ip-per-minute=100000

# 첨부파일은 빌드 폴더 아래에 저장 (테스트가 끝나도 프로젝트를 더럽히지 않게)
astra.storage.dir=build/test-uploads
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
